<body>
    <script>
        let numeros = [1,2,3,4,5]

      function duplicar(){
        //vamos usar o map para ter o dobro desse array
            return numeros.map(function(valor){
            return valor*2
        })
      }

        let dobro = duplicar()
        console.log(dobro)
        console.log(numeros)
        // este é o map traballha todos os elementos do nosso array e devolve um novo ja transformado

        //agora temos aseguite situação:

        let idade = [20,13,7,30,42,26]
        idade.sort((a,b) => a-b); // esta é uma forma de organizar os dados de forma a garrantir o maior atrás e menor em frente
        //queremos a idade do mais velho
        // usando a minha lógica precária, primeiro ordenaria os elemento do menor ao maior,
        //  entao saberia que o maior está na ultima posição que equivale a idade.length-1
        
            let Maior = idade[idade.length-1]
            console.log(Maior)
            // Aí entra o elemento filter que vai filtrar todo nosso array e vai devolver por exemplo o numero maior da lista

            let maiores = idade.filter(function(valor){
                return valor == idade[idade.length - 1]
            })
           // console.log(maiores)

            let max = idade[0]
            let min = idade[0]
            let pos = 1

            for( pos  in idade){

                }else{

                }
            }
            console.log(max)
            console.log(min)

                    return valor > 20
                })
            }
            let idades20 =  idadesMaiores20()

    </script>
