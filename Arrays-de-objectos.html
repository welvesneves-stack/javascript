<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objectos de arrays</title>
</head>
<body>
    <script>
        // os arrays de objectos consistem em criar um array e dentro dele colocar objetos
        let produtos = [
            {nome: "arroz", preco: 180}, // esse objeto está na posição 0 do nosso array produtos
            {nome: "leite", preco: 165},
            {nome: "manteiga", preco: 90}
        ]

        console.log(produtos) // para acessar todo nosso array

        console.log(produtos[0]) // vai exibir o objecto que está na primeira posicao

        console.log(produtos[0].nome) // vai exibir  a proriedade nome que existe no objecto que esta na primeira posição do array

        for(let produto of produtos){
            console.log(produto.nome) // aquí estamos percorrendo o array e querendo ver todos os valores da propriedade nome que estao no array produto
        }

        let maioresque70 = produtos.filter(function(valor){ // nessa funtion estamos a filtrar no nosso array um preco maior que 70
            return valor.preco > 70
        })


        console.log(maioresque70)
        
        for(let prod of maioresque70){ // e nesta estamos percorrendo maioresque70 para poder exibir somente os nomes nao o objecto todo
            console.log(prod.nome)
        }

        //exercício

        let alunos = [
            {nome: "welves", nota: 14},
            {nome: "joão", nota: 12},
            {nome: "maria", nota: 18},
            {nome: "pedro", nota: 16}
        ]


        for( let situacao of alunos){
            console.log(`${situacao.nome} tirou ${situacao.nota}`)
        }
        
            let maioresque16 = alunos.filter((valor)=>{
                return valor.nota > 15
            })

            for(let nomesdos16 of maioresque16){
                console.log(nomesdos16.nome)
            }

            let desconto = produtos.map((valor)=>{ // o map percorre o array e devolve um novo array alterado
                return valor.preco - 10
            })

            console.log(desconto)
        
        
    </script>
</body>
</html>
