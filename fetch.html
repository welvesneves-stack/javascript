<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch</title>
</head>
<body>
    <script>
        fetch("https://Jsonplaceholder.typicode.com/users") // primeiro coloquei um caminho para uma api publica e de seguida peguei a resposta e converte em json 
        .then((resposta)=>{
            return resposta.json() 
        })
        .then((usuarios)=>{ // aqui peguei os dados que estao na api
            for(let nomes of usuarios){ //depois percorri so pra poder retornar apenas os nomes
                console.log(nomes.name)
            }
            let Gwenborough = usuarios.filter((moradores)=>{
                return moradores.address.city == "Gwenborough" //aqui usei o filter para poder trazer moradores pertecentes a uma certa cidade
            })
            console.log(Gwenborough)
        })
        .catch((erro=>{
            console.log("Erro:", erro)
        }))
    </script>
</body>
</html>
